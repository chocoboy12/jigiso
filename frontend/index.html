<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JIGISO — Votre prochaine adresse au Mali, sans intermédiaire. Maisons, appartements, studios et villas, en direct avec les propriétaires." />
    <meta name="theme-color" content="#17150F" />
    <title>JIGISO — Location immobilière au Mali</title>
    <meta name="robots" content="index, follow" />
    <!-- Aperçu du lien partagé (WhatsApp, Facebook…) et résultats Google.
         %VITE_SITE_URL% est remplacé à la construction (voir deploy-site.sh). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JIGISO" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="JIGISO — Location immobilière au Mali" />
    <meta property="og:description" content="Maisons, appartements, studios et villas à louer au Mali, en direct avec les propriétaires, sans commission." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/logo-lockup.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JIGISO",
        "alternateName": "JIGISO Mali",
        "url": "%VITE_SITE_URL%/",
        "inLanguage": "fr",
        "description": "Location de maisons, appartements, studios et villas au Mali, en direct avec les propriétaires, sans commission.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "%VITE_SITE_URL%/rechercher?city={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Google Fonts — Source Serif 4 (titres), Inter (interface), DM Mono (micro-libellés) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Flaticon UIcons — jeu d'icônes du site (remplace les emojis) -->
    <link rel="preconnect" href="https://cdn-uicons.flaticon.com" crossorigin>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
